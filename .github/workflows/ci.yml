name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify manifest, versions, docs & repo hygiene
        run: python3 tools/release_check.py

      - name: Build CLI & C-shared library
        run: make build

      - name: Run Go vet & tests with race detector
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Run Python native, golden & example tests
        run: make test-py

      - name: Test pip install & bundled manifest
        run: |
          pip install --no-build-isolation --no-deps .
          python -c "from pathlib import Path; import rulemma; from rulemma import RuLemma, normalize_phrase; r = RuLemma(); assert r.backend == 'native'; assert r.abi_version == 1; assert r.library_version == rulemma.__version__; assert (Path(r.data_dir) / 'manifest.json').exists(); assert r.semantic_key('зимние кроссовки') == r.semantic_key('кроссовки на зиму'); assert r.lemma_key('Купить кроссовки в Москве', stopwords={'в', 'москва'}) == 'кроссовок купить'; assert normalize_phrase('Чёрная, 35 см!') == 'черная 35 см'; print('pip install OK:', r.library_version, r.stats())"
